<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kurama AI</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#070b16">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="logo">🦊 KURAMA AI</div>
  <div class="right">
    <button id="newchat">+ New chat</button>
    <div class="status"><span class="dot"></span> Online</div>
  </div>
</header>

  <div class="modebar">
  <select id="mode">
    <option value="chat">💬 Chat mode</option>
    <option value="study">📚 Study mode</option>
    <option value="coding">💻 Coding mode</option>
    <option value="anime">🦊 Anime mode</option>
    <option value="writing">✍️ Writing mode</option>
    <option value="creative">🎨 Creative mode</option>
  </select>
  <button id="web" type="button">🌐 Web: off</button>
  </div>
  
<main id="chat">
  <div class="msg kurama">I'm awake, Harshith! What are we doing today?</div>
</main>

<footer>
  <input id="input" type="text" placeholder="Talk to Kurama...">
  <button id="photo">📷</button>
  <input id="file" type="file" accept="image/*" hidden>
  <button id="send">➤</button>
  <button id="mic">🎤</button>
</footer>
  
<div id="panel" hidden>
  <div class="panel-head">
    <span>Your chats</span>
    <button id="closepanel" type="button" class="icon-btn">✕</button>
  </div>
  <button id="panelnew" type="button" class="wide">+ New chat</button>
  <div id="chatlist"></div>
</div>
  
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
<script src="script.js?v=15"></script>
</body>
</html>
