<!DOCTYPE html>
<html lang="en">
<head>

<title>Kurama AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>

</main>

  <button id="send">➤</button>
  <button id="mic">🎤</button>
</footer>

<script src="script.js?v=4"></script>
</body>
</html>
